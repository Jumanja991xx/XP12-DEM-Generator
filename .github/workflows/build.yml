name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Build executables
        run: pyinstaller --noconfirm packaging/xp12dem.spec
      - name: Smoke test - build one real tile with the packaged app
        timeout-minutes: 20
        shell: pwsh
        run: |
          $xp = Join-Path $env:RUNNER_TEMP "X-Plane 12"
          New-Item -ItemType Directory -Force -Path "$xp\Custom Scenery", "$xp\Global Scenery\X-Plane 12 Global Scenery" | Out-Null
          $env:XP12DEM_DATA = Join-Path $env:RUNNER_TEMP "xp12dem data"
          # Public Overpass servers throttle GitHub's shared runner IPs, so the
          # smoke test uses a pre-seeded (empty) OSM cache for the tile. Everything
          # else - DEM download, worker exe, Triangle4XP, DSF writing, install - is real.
          python packaging/ci_seed_osm.py "$env:XP12DEM_DATA" 47 11
          "XP=$xp" >> $env:GITHUB_ENV
          "XP12DEM_DATA=$env:XP12DEM_DATA" >> $env:GITHUB_ENV
          $p = Start-Process -FilePath "dist\XP12DEMGenerator\XP12DEMGenerator.exe" -Wait -PassThru -ArgumentList @(
            "build", "--method", "rebuild", "--tiles", "+47+011", "--name", "`"CI Smoke`"", "--resolution", "3",
            "--mesh", "balanced", "--xplane", "`"$xp`"", "--target", "custom_scenery")
          $dsf = "$xp\Custom Scenery\z_ao_dem_ci_smoke\Earth nav data\+40+010\+47+011.dsf"
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $dsf)
          # Collect diagnostics and surface them as an annotation (readable via the API).
          $diag = @("exit=$($p.ExitCode) dsf=$(Test-Path $dsf)")
          if (Test-Path "$env:XP12DEM_DATA\logs") {
            Get-ChildItem -Recurse -File "$env:XP12DEM_DATA\logs" | ForEach-Object {
              $diag += "== $($_.Name)"
              $diag += Get-Content $_.FullName -Tail 25 | Where-Object { $_ -notmatch '"kind": "bar"' }
            }
          } else { $diag += "no log folder" }
          if (Test-Path "$xp\Custom Scenery\scenery_packs.ini") { $diag += Get-Content "$xp\Custom Scenery\scenery_packs.ini" }
          $text = (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          if ($ok) { Write-Output "::notice title=Smoke test::$text" } else { Write-Output "::error title=Smoke test::$text"; exit 1 }
      - name: Smoke test - new mesh with XPME's photos
        timeout-minutes: 20
        shell: pwsh
        run: |
          # A stand-in XPME package outside X-Plane (absolute scenery_packs.ini entry, like
          # XPME's Documents folder); the new mesh must point its terrain at its textures.
          $xpme = Join-Path $env:RUNNER_TEMP "Documents\XPMapEnhancement\BasePack\XPME_Europe"
          New-Item -ItemType Directory -Force -Path "$xpme\Earth nav data\+40+010", "$xpme\textures" | Out-Null
          Set-Content "$xpme\Earth nav data\+40+010\+47+011.dsf" "x"
          $ini = "$env:XP\Custom Scenery\scenery_packs.ini"
          $saved = Get-Content $ini -Raw
          Add-Content $ini ("SCENERY_PACK " + ($xpme -replace '\\', '/') + "/")
          $p = Start-Process -FilePath "dist\XP12DEMGenerator\XP12DEMGenerator.exe" -Wait -PassThru -ArgumentList @(
            "build", "--method", "rebuild", "--tiles", "+47+011", "--name", "`"CI XPME`"", "--resolution", "3",
            "--mesh", "balanced", "--xplane", "`"$env:XP`"", "--target", "xpme")
          $pack = "$env:XP\Custom Scenery\z_dem_mesh_ci_xpme"
          $dsf = "$pack\Earth nav data\+40+010\+47+011.dsf"
          $ter = Get-ChildItem "$pack\terrain" -Filter *.ter -ErrorAction SilentlyContinue | Select-Object -First 1
          $tex = if ($ter) { (Get-Content $ter.FullName | Where-Object { $_ -match '^BASE_TEX' }) -join ' ' } else { "" }
          $lines = Get-Content $ini
          $mine = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match 'z_dem_mesh_ci_xpme' })
          $theirs = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match 'XPME_Europe' })
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $dsf) -and ($tex -match 'XPME_Europe/textures/\d+_\d+_BI1[68]\.dds') -and ($mine -ge 0) -and ($mine -lt $theirs)
          $diag = @("exit=$($p.ExitCode) dsf=$(Test-Path $dsf) ini=$mine<$theirs", "ter: $tex")
          if (Test-Path "$env:XP12DEM_DATA\logs\cli.log") { $diag += Get-Content "$env:XP12DEM_DATA\logs\cli.log" -Tail 25 }
          $diag += $lines
          # leave X-Plane as the next steps expect it
          Set-Content $ini $saved -NoNewline
          Remove-Item -Recurse -Force $pack -ErrorAction SilentlyContinue
          $text = (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          if ($ok) { Write-Output "::notice title=XPME mesh smoke test::$text" } else { Write-Output "::error title=XPME mesh smoke test::$text"; exit 1 }
      - name: Smoke test - improve existing terrain (XPME / no-ortho mode)
        timeout-minutes: 20
        shell: pwsh
        run: |
          # The pack from the previous step acts as the "existing" terrain (like an XPME
          # base package); the app must find it, re-height it and install above it.
          $p = Start-Process -FilePath "dist\XP12DEMGenerator\XP12DEMGenerator.exe" -Wait -PassThru -ArgumentList @(
            "build", "--method", "improve", "--tiles", "+47+011", "--name", "`"CI Improve`"",
            "--resolution", "1", "--xplane", "`"$env:XP`"")
          $pack = "$env:XP\Custom Scenery\z_dem_ci_improve"
          $dsf = "$pack\Earth nav data\+40+010\+47+011.dsf"
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $dsf)
          $diag = @("exit=$($p.ExitCode) dsf=$(Test-Path $dsf)")
          if (Test-Path "$env:XP12DEM_DATA\logs\cli.log") { $diag += Get-Content "$env:XP12DEM_DATA\logs\cli.log" -Tail 30 }
          if (Test-Path "$env:XP12DEM_DATA\logs\+47+011.log") { $diag += Get-Content "$env:XP12DEM_DATA\logs\+47+011.log" -Tail 15 | Where-Object { $_ -notmatch '"kind": "bar"' } }
          if (Test-Path "$pack\terrain") { $diag += (Get-ChildItem "$pack\terrain" | Select-Object -First 1 | Get-Content) }
          $diag += Get-Content "$env:XP\Custom Scenery\scenery_packs.ini"
          $text = (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          if ($ok) { Write-Output "::notice title=Improve smoke test::$text" } else { Write-Output "::error title=Improve smoke test::$text"; exit 1 }
      - name: Smoke test - USGS 3DEP GeoTIFF download (USA)
        timeout-minutes: 20
        shell: pwsh
        run: |
          python packaging/ci_seed_osm.py "$env:XP12DEM_DATA" 39 -106
          $p = Start-Process -FilePath "dist\XP12DEMGenerator\XP12DEMGenerator.exe" -Wait -PassThru -ArgumentList @(
            "build", "--method", "rebuild", "--tiles", "+39-106", "--name", "`"CI Colorado`"", "--resolution", "3",
            "--mesh", "balanced", "--xplane", "`"$env:XP`"", "--target", "custom_scenery")
          $manifest = "$env:XP\Custom Scenery\z_ao_dem_ci_colorado\xp12dem_pack.json"
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $manifest) -and ((Get-Content $manifest -Raw) -match "USGS")
          $diag = @("exit=$($p.ExitCode) manifest=$(Test-Path $manifest)")
          if (Test-Path "$env:XP12DEM_DATA\logs\cli.log") { $diag += Get-Content "$env:XP12DEM_DATA\logs\cli.log" -Tail 25 }
          if (Test-Path $manifest) { $diag += Get-Content $manifest }
          $text = (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          if ($ok) { Write-Output "::notice title=USGS smoke test::$text" } else { Write-Output "::error title=USGS smoke test::$text"; exit 1 }
      - name: Smoke test - improve with 1/3 arc-second (10 m) data
        timeout-minutes: 25
        shell: pwsh
        run: |
          # re-heights the Colorado pack from the previous step with USGS 3DEP 1/3" data
          $p = Start-Process -FilePath "dist\XP12DEMGenerator\XP12DEMGenerator.exe" -Wait -PassThru -ArgumentList @(
            "build", "--method", "improve", "--tiles", "+39-106", "--name", "`"CI Ten`"",
            "--resolution", "13", "--xplane", "`"$env:XP`"")
          $dsf = "$env:XP\Custom Scenery\z_dem_ci_ten\Earth nav data\+30-110\+39-106.dsf"
          $hgt = "$env:XP12DEM_DATA\dem\13s\N39W106.hgt"
          $ok = ($p.ExitCode -eq 0) -and (Test-Path $dsf) -and (Test-Path $hgt) -and ((Get-Item $hgt).Length -eq 233323202)
          $diag = @("exit=$($p.ExitCode) dsf=$(Test-Path $dsf) hgt=$(if (Test-Path $hgt) { (Get-Item $hgt).Length })")
          if (Test-Path "$env:XP12DEM_DATA\logs\cli.log") { $diag += Get-Content "$env:XP12DEM_DATA\logs\cli.log" -Tail 25 }
          $text = (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          if ($ok) { Write-Output "::notice title=10 m smoke test::$text" } else { Write-Output "::error title=10 m smoke test::$text"; exit 1 }
      - name: Elevation sources reachability (informational)
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $out = python packaging/ci_probe_sources.py 2>&1
          $out
          $text = (($out | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join "%0A") -replace "::", ": :"
          Write-Output "::notice title=Elevation sources::$text"
      - name: Overpass reachability (informational)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          python packaging/ci_check_overpass.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist\XP12DEMGenerator\
          Compress-Archive -Path dist\XP12DEMGenerator -DestinationPath XP12DEMGenerator-windows.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import xp12dem; print(xp12dem.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DMyAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item "dist\XP12DEMGenerator-Setup-$version.exe" "XP12DEMGenerator-Setup.exe"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "Installer: $((Get-Item XP12DEMGenerator-Setup.exe).Length / 1MB) MB"
      - name: Smoke test - silent install and uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "XP12 DEM Install Test"
          $p = Start-Process XP12DEMGenerator-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\XP12DEMGenerator.exe") -or -not (Test-Path "$dir\xp12dem-worker.exe")) { throw "install failed ($($p.ExitCode))" }
          $u = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep 3
          if (Test-Path "$dir\XP12DEMGenerator.exe") { throw "uninstall left files behind" }
          "install/uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: XP12DEMGenerator-Setup
          path: XP12DEMGenerator-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: XP12DEMGenerator-windows
          path: XP12DEMGenerator-windows.zip
      - name: Publish release (commit on main marked [release])
        # creates tag v<version> from xp12dem/__init__.py - for when tags cannot be pushed
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: XP12 DEM Generator ${{ env.APP_VERSION }}
          body_path: packaging/release_notes.md
          files: |
            XP12DEMGenerator-Setup.exe
            XP12DEMGenerator-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            XP12DEMGenerator-Setup.exe
            XP12DEMGenerator-windows.zip
          generate_release_notes: true
